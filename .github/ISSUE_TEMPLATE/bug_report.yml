name: Report a bug
description: Report reproducible behavior in the project.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, production databases, or personal data.
  - type: textarea
    id: problem
    attributes:
      label: What happened
      description: Explain the observed and expected results.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: input
    id: environment
    attributes:
      label: Browser and environment
      placeholder: Chrome 128 on Android; Docker on Ubuntu 24.04
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      render: shell
