name: Request a feature
description: Describe a need and the outcome you want.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Need
      description: Which task can you not complete today, and who performs it?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: Describe the behavior, not only a screen.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Public site
        - Competition and bracket
        - Administration
        - Point of sale and inventory
        - Users and permissions
        - Installation and deployment
        - Documentation
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
